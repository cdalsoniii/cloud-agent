# Grounded ontology / formal pointers — relative to cloud-agent root unless absolute.

px_validate:
  description: Canonical ontology + multi-method formal stack (do not duplicate)
  # From partners/experiments/01-platform/cloud-agent → Brightforest path varies by machine.
  # Prefer env PX_VALIDATE_ROOT; fallback absolute for this workspace:
  root_env: PX_VALIDATE_ROOT
  root_default: /Users/clifforddalsoniii/Documents/Brightforest/projects/tools/px-validate
  paths:
    formal_readme: formal/README.md
    formal_health: formal/FORMAL_METHODS_HEALTH_REPORT.md
    official_refs: formal/OFFICIAL_REFERENCES.md
    ontology_classes: formal/ontology-classes/
    validation_pipeline: formal/VALIDATION_PIPELINE.md
    events_shared: formal/shared/events.yaml
    types_shared: formal/shared/types.yaml

cloud_agent_verification:
  description: Local formal specs for sandbox lifecycle, tokens, MCP tools
  root: config/verification/
  suites:
    quint: config/verification/quint/sandbox-lifecycle.qnt
    dafny:
      - config/verification/dafny/ValidationGate.dfy
      - config/verification/dafny/TokenIsolation.dfy
    alloy:
      - config/verification/alloy/MidspiralTools.als
      - config/verification/alloy/BusinessRules.als
  ci: .github/workflows/formal-verification.yml
  scripts:
    verify_local: scripts/verify-local.sh
    setup_tools: scripts/setup-verification-tools.sh
    smoke_formal: scripts/smoke-formal-happy-path.sh

assistant_ui:
  description: Product formal happy path (dafny2js, dafny-replay, kernels) + px-kernel
  root: ../../02-products/assistant-ui
  px_kernel:
    root: ../../02-products/assistant-ui/.px
    linkml_verifiers: ../../02-products/assistant-ui/.px/linkml/verifiers
    formal: ../../02-products/assistant-ui/.px/formal
    mcp_api: /api/px-kernel
    hosts: [claude, grok, pi, henri, mock]
    note: Host-agnostic; Henri is optional pointer not required
  gap_analysis: ../../02-products/assistant-ui/.gap-analysis.md
  verify_apis:
    dafny2js: packages/web/src/app/api/verify/dafny2js/route.ts
    dafny_replay: packages/web/src/app/api/verify/dafny-replay/route.ts
    claimcheck: packages/web/src/app/api/verify/claimcheck
    health: packages/web/src/app/api/verify/health
  verification:
    dafny: config/verification/dafny/
    lemma_replay: config/verification/lemma/lemmafit/dafny/Replay.dfy
    lemma_alt: baseten-chains/quint-monitor/config/verification/lemma/lemmafit/dafny/Replay.dfy
  packages:
    verified_kernels: packages/verified-kernels/
    kernel_src: packages/verified-kernels/src/kernel.ts
  env:
    DAFNY2JS_PATH: "dotnet project cwd for dafny2js API (spawn cwd)"
    DAFNY_REPLAY_PATH: "optional path for dafny-replay tooling"
  cicd:
    description: Product CI/CD delegates back to this cloud-agent (chainlets + Daytona sandboxes)
    plan: ../../02-products/assistant-ui/.gsd/plans/cicd-chainlet-sandbox.md
    milestone: ../../02-products/assistant-ui/.gsd/milestones/M7-cicd-chainlet-sandbox/M7-ROADMAP.md
    ci_all: ../../02-products/assistant-ui/.github/workflows/ci-all.yml
    sandbox_driver: ../../02-products/assistant-ui/scripts/ci-sandbox-shards.sh
    chainlet_delegate: ../../02-products/assistant-ui/scripts/ci-chainlet-delegate.sh
    px_pointers: ../../02-products/assistant-ui/.px/pointers.yaml  # → cicd_chainlet_sandbox
    drivers_here:
      chain_sandbox: src/baseten-chain-sandbox.ts   # npm run chain-sandbox
      pr_sandbox: src/pr-sandbox-orchestrator.ts     # npm run pr-sandbox
      remote_formal: scripts/remote-formal-daytona.sh

prd_pack:
  root: artifacts/prd/smoke-formal-happy-path/
  milestones: artifacts/prd/smoke-formal-happy-path/06-MILESTONES.md
  issues: artifacts/prd/smoke-formal-happy-path/03-ISSUE_BACKLOG.md
  prd: artifacts/prd/smoke-formal-happy-path/04-PRD.md
  jobs: artifacts/prd/smoke-formal-happy-path/07-jobs.json

osdk_deel_asana_map:
  description: M6 (product repo) — OSDK "Global workforce + delivery map" (synthetic Deel × Asana; ontology-driven SDK regen; SurrealDB TS; Midspiral). Platform owns verify/smoke for this path.
  product_root: ../../02-products/assistant-ui
  product_milestone: ../../02-products/assistant-ui/.gsd/milestones/M6-osdk-deel-asana-map/
  product_ontology: ../../02-products/assistant-ui/packages/web/src/lib/osdk/schema/deel-asana-map.linkml.yaml
  product_regen: cd ../../02-products/assistant-ui/packages/web && npm run osdk:regen
  product_formal:
    - ../../02-products/assistant-ui/config/verification/quint/osdk-xref.qnt
    - ../../02-products/assistant-ui/config/verification/alloy/OsdkXref.als
  platform_verify:
    smoke_formal: npm run smoke:formal
    verify_quint: npm run verify:quint
  evidence_glob: .gsd/evidence/20260721-m6-*
  req_ids: [REQ-OSDK-MAP, REQ-DEEL-SAMPLE, REQ-ASANA-XREF, REQ-MIDSPIRAL-XREF, REQ-SURREAL-UI, REQ-ONTOLOGY-SDK-REGEN]

gsd:
  root: .gsd/
  state: .gsd/STATE.md

surreal_graphql_gateway:
  description: SurrealDB v3 + Apollo/WunderGraph federation stack and schema sync
  root: ../../02-products/surreal-graphql-gateway
  graphql_manifest: ../../02-products/surreal-graphql-gateway/.px/graphql/manifest.yaml
  scripts:
    schema_sync: npm run schema:sync
    schema_check: npm run schema:check
    surreal_sync: npm run surreal:sync
    surreal_mcp_apply: npm run surreal:mcp:apply
    smoke: npm run smoke
  surrealkit:
    database_dir: ../../02-products/surreal-graphql-gateway/.px/database
    docs: https://github.com/surrealdb/surrealkit
  opencode_plugin: .opencode/plugins/surreal-schema.ts
  opencode_tui: .opencode/plugins/px-ontology-tui.tsx
  grok_skills:
    schema_sync: .grok/skills/surreal-schema-sync/SKILL.md
    ontology_edit: .grok/skills/ontology-edit/SKILL.md
    update_ontology: .grok/skills/update-ontology/SKILL.md

grok_bundle:
  description: Native Surreal toolchain for Grok Build (no Docker MCP)
  root_env: PX_GROK_BUNDLE
  root_default: .grok-bundle
  manifest: grok-dist/manifest.yaml
  scripts:
    fetch: scripts/grok-bundle-fetch.sh
    install: scripts/grok-bundle-install.sh
    surreal_stack: scripts/surreal-stack.sh
    smoke: scripts/smoke-grok-surreal.sh
  grok_config: .grok/config.toml
  grok_skill: .grok/skills/surreal-schema-sync/SKILL.md

lean_bundle:
  description: Native Lean 4 + lake serve + live bridge for Grok Build
  root_env: PX_GROK_BUNDLE
  workspace_env: LEAN_WORKSPACE
  workspace_default: config/verification/lean
  workspace_formal: "${PX_VALIDATE_ROOT}/formal"
  runtime_dir: .px/lean-live
  bridge_port_env: LEAN_LIVE_PORT
  bridge_port_default: 9474
  scripts:
    lean_stack: scripts/lean-stack.sh
    lean_bridge: scripts/lean-live-bridge.sh
    grok_split: scripts/grok-lean-split.sh
    smoke: scripts/smoke-grok-lean.sh
    build_grok_fork: scripts/build-grok-lean.sh
  grok_plugin: .grok/plugins/lean-live
  grok_skill: .grok/plugins/lean-live/skills/lean-proof-gate/SKILL.md
  docs: docs/grok-lean-bundle.md
  verifier_ui: apps/mcp-verifier/app/lean-live
  grok_fork: vendor/grok-build-lean

claude_lean:
  description: Claude Code via OpenRouter + Lean live pane (tmux split)
  docs: docs/claude-lean-openrouter.md
  settings: .claude/settings.json
  openrouter_snippet: config/claude-openrouter-snippet.json
  scripts:
    claude_openrouter: scripts/claude-openrouter.sh
    claude_split: scripts/claude-lean-split.sh
    opencode_split: scripts/opencode-lean-split.sh
  bin:
    claude_lean: bin/claude-lean
  opencode_tui: .opencode/plugins/px-lean-live-tui.tsx
  opencode_snippet: config/opencode.openrouter-snippet.json
