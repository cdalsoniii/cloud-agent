[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log

[program:verifier-services]
command=python3 /opt/verifier/multi-service-server.py
autostart=true
autorestart=true
stdout_logfile=/tmp/verifier-services.log
stderr_logfile=/tmp/verifier-services.err

[program:shacl-server]
command=python3 /opt/verifier/shacl-server.py --port 7004 --shapes-dir /opt/verifier/px/generated
autostart=true
autorestart=true
environment=SHACL_SHAPES_DIR="/opt/verifier/px/generated",SHACL_PORT="7004"
stdout_logfile=/tmp/shacl-server.log
stderr_logfile=/tmp/shacl-server.err
